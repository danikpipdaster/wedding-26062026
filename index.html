    <style>
        @font-face {
            font-family: 'French Kiss Script';
            src: url('FrenchKissscript.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-main: #f1e2d8;
            --bg-light: #f7ebe3;
            --bg-warm: #ead7cb;
            --text-main: #4a3f3f;
            --text-soft: #7a675d;
            --accent: #b8977e;
            --accent-soft: #e8cec4;
            --green-soft: #c8d5c0;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(90, 70, 60, 0.16);
            --shadow-soft: 0 12px 35px rgba(90, 70, 60, 0.14);
            --shadow-photo: 0 24px 55px rgba(0, 0, 0, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 10%, rgba(232, 206, 196, 0.75), transparent 32%),
                radial-gradient(circle at 88% 18%, rgba(200, 213, 192, 0.55), transparent 30%),
                radial-gradient(circle at 18% 82%, rgba(218, 207, 224, 0.45), transparent 34%),
                linear-gradient(180deg, #f4e8df 0%, #efe1d7 45%, #ead8cc 100%);
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-main);
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.42;
            background:
                repeating-linear-gradient(
                    45deg,
                    rgba(255,255,255,0.16) 0px,
                    rgba(255,255,255,0.16) 1px,
                    transparent 1px,
                    transparent 8px
                ),
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35) 0 2px, transparent 2px),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.25) 0 2px, transparent 2px);
            background-size: auto, 46px 46px, 62px 62px;
        }

        .decor-branch-left,
        .decor-branch-right {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.055;
            font-size: clamp(150px, 18vw, 280px);
            color: #8a9a7b;
            font-family: serif;
            line-height: 1;
        }

        .decor-branch-left {
            top: -45px;
            left: -70px;
            transform: rotate(-15deg);
        }

        .decor-branch-right {
            bottom: -45px;
            right: -70px;
            transform: rotate(165deg);
        }

        .splash {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100svh;
            padding: clamp(24px, 6vw, 48px) 18px;
            text-align: center;
            background:
                linear-gradient(rgba(250,247,244,0.72), rgba(250,247,244,0.78)),
                url('ryki.jpg') center/cover no-repeat;
            background-color: var(--bg-main);
        }

        .splash::after {
            content: "";
            position: absolute;
            inset: auto 0 0;
            height: 130px;
            pointer-events: none;
            background: linear-gradient(to bottom, transparent, #f7ebe3);
        }

        .initials-block {
            position: relative;
            z-index: 1;
            margin-bottom: 0.3em;
        }

        .initial-line {
            display: block;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(88px, 18vw, 150px);
            font-weight: 400;
            color: var(--text-main);
            text-shadow: 0 6px 18px rgba(0,0,0,0.1);
            line-height: 0.95;
        }

        .initial-line.line-d {
            text-align: left;
            transform: translateX(clamp(-45px, -6vw, -25px));
        }

        .initial-line.line-amp {
            text-align: center;
            font-size: clamp(42px, 7vw, 60px);
            margin: -10px 0;
        }

        .initial-line.line-yu {
            text-align: right;
            transform: translateX(clamp(25px, 6vw, 45px));
        }

        .handwritten-signature {
            position: relative;
            z-index: 1;
            font-family: 'Caveat', cursive;
            font-size: clamp(24px, 5vw, 32px);
            color: var(--text-main);
            margin-top: 6px;
            line-height: 1.35;
        }

        .heart-img {
            height: 14px;
            width: auto;
            vertical-align: middle;
            margin: 0 4px;
            display: inline-block;
        }

        .hero-subtitle {
            position: relative;
            z-index: 1;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: clamp(12px, 2.8vw, 14px);
            letter-spacing: clamp(3px, 1vw, 6px);
            text-transform: uppercase;
            color: #9a8a7a;
            margin-top: 16px;
        }

        .date-container {
            position: relative;
            z-index: 1;
            margin-top: clamp(30px, 6vw, 42px);
        }

        .scratch-hint {
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            margin-bottom: 12px;
            opacity: 0.72;
            color: #9a8a7a;
            letter-spacing: 2px;
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0% { opacity: 0.45; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
            100% { opacity: 0.45; transform: translateY(0); }
        }

        .scratch-area {
            position: relative;
            display: inline-block;
        }

        .date {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(30px, 7vw, 46px);
            font-weight: 400;
            letter-spacing: clamp(3px, 1.2vw, 6px);
            color: var(--text-main);
            padding: 8px 20px;
            white-space: nowrap;
        }

        #scratch {
            position: absolute;
            top: 0;
            left: 0;
            cursor: none;
            touch-action: none;
            border-radius: 8px;
        }

        .coin {
            position: fixed;
            width: 28px;
            height: 28px;
            background: url('monetka.jpg') center/cover no-repeat;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .timer {
            position: relative;
            z-index: 1;
            margin-top: 28px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: clamp(13px, 3vw, 16px);
            letter-spacing: clamp(1.5px, 0.6vw, 3px);
            color: #9a8a7a;
            line-height: 1.7;
        }

        .timer span {
            color: var(--accent);
            font-weight: 400;
        }

        .scroll-arrow {
            position: relative;
            z-index: 1;
            display: inline-block;
            margin-top: clamp(28px, 6vw, 42px);
            font-size: 32px;
            color: var(--accent);
            text-decoration: none;
            animation: arrowBounce 2s infinite;
            cursor: pointer;
            transition: opacity 0.3s;
            opacity: 0.72;
        }

        .scroll-arrow:hover {
            opacity: 1;
        }

        @keyframes arrowBounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        .content-bg {
            position: relative;
            z-index: 2;
            background:
                radial-gradient(circle at 8% 8%, rgba(232, 206, 196, 0.65), transparent 32%),
                radial-gradient(circle at 92% 22%, rgba(200, 213, 192, 0.50), transparent 30%),
                radial-gradient(circle at 16% 76%, rgba(218, 207, 224, 0.40), transparent 34%),
                radial-gradient(circle at 85% 88%, rgba(205, 223, 232, 0.38), transparent 30%),
                linear-gradient(180deg, #f7ebe3 0%, #f1e2d8 45%, #ead7cb 100%);
        }

        .section {
            position: relative;
            width: 100%;
            background: transparent;
            padding: clamp(52px, 8vw, 76px) 0;
            margin: 0;
        }

        .section-inner {
            max-width: 940px;
            margin: 0 auto;
            padding: 0 clamp(16px, 4vw, 28px);
            width: 100%;
        }

        .section-title {
            font-family: 'French Kiss Script', 'Cormorant Garamond', cursive;
            font-size: clamp(40px, 8vw, 74px);
            font-weight: 400;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(255,255,255,0.95);
        }

        .section-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: clamp(12px, 2.7vw, 16px);
            letter-spacing: clamp(2px, 0.8vw, 4px);
            text-transform: uppercase;
            color: var(--text-soft);
            margin-bottom: 30px;
            text-shadow: 0 1px 5px rgba(255,255,255,0.95);
        }

        .welcome-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(18px, 3.5vw, 25px);
            line-height: 1.7;
            color: var(--text-main);
            max-width: 720px;
            margin: 0 auto;
            text-shadow: 0 1px 6px rgba(255,255,255,0.95);
        }

        .divider {
            width: 64px;
            height: 2px;
            background: linear-gradient(to right, transparent, #7d6f64, transparent);
            margin: 24px auto 0;
            border-radius: 1px;
            opacity: 0.78;
        }

        .photo-hint {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            font-size: clamp(13px, 2.8vw, 16px);
            letter-spacing: clamp(2px, 0.7vw, 3px);
            opacity: 0.95;
            margin-bottom: 8px;
            color: #6f5f56;
            text-shadow: 0 1px 5px rgba(255,255,255,0.95);
            animation: hintFloat 1.8s infinite;
        }

        @keyframes hintFloat {
            0% { opacity: 0.65; }
            50% { opacity: 1; }
            100% { opacity: 0.65; }
        }

        .photo-collage {
            position: relative;
            width: min(620px, 94vw);
            height: clamp(430px, 82vw, 680px);
            margin: 28px auto 12px;
            perspective: 1400px;
        }

        .flip-card {
            position: absolute;
            top: 0;
            left: 0;
            width: clamp(230px, 60vw, 400px);
            height: clamp(320px, 78vw, 550px);
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(.22,.61,.36,1), opacity 0.7s ease;
            will-change: transform;
        }

        .flip-card.front {
            transform: translate(clamp(70px, 25vw, 170px), clamp(82px, 14vw, 100px)) rotate(0deg) scale(1.04);
            z-index: 10;
        }

        .flip-card.back {
            transform: translate(clamp(4px, 1vw, 0px), clamp(-20px, 1vw, 5px)) rotate(-7deg) scale(0.92);
            z-index: 1;
        }

        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.95s cubic-bezier(.22,.61,.36,1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-inner {
            transform: rotateY(180deg);
        }

        .flip-front,
        .flip-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            background-color: #ffffff;
            border-radius: 22px;
            overflow: hidden;
        }

        .flip-back {
            transform: rotateY(180deg);
        }

        .flip-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            background: #ffffff;
            padding: 8px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.22);
            box-sizing: border-box;
        }

        .flip-card.front img {
            box-shadow: var(--shadow-photo);
        }

        .locations-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(28px, 5vw, 42px);
            align-items: start;
            justify-content: center;
            max-width: 560px;
            margin: 0 auto;
        }

        .location-inner {
            background: var(--card-bg);
            border-radius: 26px;
            padding: clamp(30px, 5vw, 42px) clamp(16px, 4vw, 24px);
            width: 100%;
            color: #333;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .location-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 34px;
        }
