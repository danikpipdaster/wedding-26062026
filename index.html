<!DOCTYPE html>
<html lang="ru"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Данил & Юлия — Приглашение на свадьбу</title>
    <link rel="preload" as="image" href="photo1.jpg">
    <link rel="preload" as="image" href="photo2.jpg">
    <link rel="preload" as="image" href="photo3.jpg">
    <link rel="preload" as="image" href="photo4.jpg">
    <link rel="preload" as="image" href="ryki.jpg">
    <link rel="preload" as="image" href="monetka.jpg">
    <link rel="preload" as="image" href="serdecko.jpg">
    <link rel="preload" as="image" href="PARA.png?v=15">
    <link rel="preload" as="image" href="PARA3.png?v=15">
    <link rel="preload" as="image" href="ceremonia.png?v=15">
    <link rel="preload" as="image" href="banket.png?v=15">
    <link rel="preload" as="image" href="tancy.png?v=15">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Стили оставляем как в оригинале */
    </style>
</head>
<body>
    <div class="decor-branch-left">❦</div>
    <div class="decor-branch-right">❦</div>
    <div class="coin" id="coin"></div>

    <div class="splash" id="splash">
        <div class="initials-block">
            <span class="initial-line line-d">Д</span>
            <span class="initial-line line-amp">&</span>
            <span class="initial-line line-yu">Ю</span>
        </div>

        <p class="handwritten-signature">
            Данил <img src="serdecko.jpg" alt="♥" class="heart-img">
            Юлия
        </p>

        <p class="hero-subtitle">приглашение на свадьбу</p>

        <div class="date-container">
            <div class="scratch-hint">Сотри меня скорей ✨</div>
            <div class="scratch-area">
                <div class="date">26.06.2026</div>
                <canvas id="scratch"></canvas>
            </div>
        </div>

        <div class="timer" id="timer"></div>
        <a href="#invitation-start" class="scroll-arrow" aria-label="К приглашению">↓</a>
    </div>

    <div id="invitation-start"></div>

    <main class="content-bg">
        <div class="section fade-in">
            <div class="section-inner">
                <h2 class="section-title" id="guest-greeting">Дорогие гости!</h2>
                <p class="welcome-text" id="guest-message">
                    Мы очень хотим, чтобы этот день<br>
                    был не просто красивым,<br>
                    а по-настоящему тёплым и живым.<br>
                    Поэтому приглашаем вас быть рядом —<br>
                    радоваться, смеяться, обниматься<br>
                    и праздновать вместе с нами ❤️
                </p>

                <div class="divider"></div>
            </div>
        </div>

        <!-- Остальные секции оставляем без изменений -->

    </main>

    <script>
        (function() {
            window.addEventListener('DOMContentLoaded', function() {
                /* Таймер и скретч остаются без изменений */

                const urlParams = new URLSearchParams(window.location.search);
                const namesParam = urlParams.get('names');
                const guestParam = urlParams.get('guest');
                const guestGreeting = document.getElementById('guest-greeting');
                const guestMessage = document.getElementById('guest-message');

                const guestPresets = {
                    'linar': {
                        names: ['Линар'],
                        gender: 'male',
                        messageHtml:
                            '<p>Мы очень хотим, чтобы этот день<br>' +
                            'был не просто красивым,<br>' +
                            'а по-настоящему тёплым и живым.</p>' +
                            '<p style="margin-top:14px;">Поэтому приглашаем тебя быть рядом —<br>' +
                            'радоваться, смеяться, обниматься<br>' +
                            'и праздновать вместе с нами ❤️</p>'
                    },

                    // можно оставлять другие шаблоны гостей здесь
                };

                const guestPresetByNamesKey = {};
                Object.keys(guestPresets).forEach(function(key) {
                    guestPresetByNamesKey[guestPresets[key].names.join(',')] = key;
                });

                function escapeHtml(str) {
                    return str.replace(/[&<>"']/g, function(char) {
                        return {
                            '&': '&amp;',
                            '<': '&lt;',
                            '>': '&gt;',
                            '"': '&quot;',
                            "'": '&#039;'
                        }[char];
                    });
                }

                function setDefaultGuestText() {
                    if (!guestGreeting || !guestMessage) return;
                    guestGreeting.textContent = 'Дорогие гости!';
                    guestMessage.innerHTML =
                        'Мы очень хотим, чтобы этот день<br>' +
                        'был не просто красивым,<br>' +
                        'а по-настоящему тёплым и живым.<br>' +
                        'Поэтому приглашаем вас быть рядом —<br>' +
                        'радоваться, смеяться, обниматься<br>' +
                        'и праздновать вместе с нами ❤️';
                }

                function applyGuestPreset(presetKey) {
                    if (!guestGreeting || !guestMessage || !guestPresets[presetKey]) return false;
                    const preset = guestPresets[presetKey];
                    guestGreeting.textContent = 'Дорогой ' + preset.names[0] + '!';
                    guestMessage.innerHTML = preset.messageHtml;
                    return true;
                }

                if (guestParam && guestPresets[guestParam]) {
                    applyGuestPreset(guestParam);
                } else if (namesParam) {
                    setDefaultGuestText();
                } else {
                    setDefaultGuestText();
                }
            });
        })();
    </script>
</body>
</html>
